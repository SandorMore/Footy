[package]
name = "FantasyFootball"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
rocket = { version = "0.5", features = ["json", "secrets"] }
rocket_ws = "0.1.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "macros", "chrono", "migrate", "tls-rustls"] }
tokio = { version = "1.53.1", features = ["full"] }
dotenvy = "0.15.7"
reqwest = "0.13.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonwebtoken = "11.0.0"
chrono = "0.4.45"
rand = "0.10.2"
tower-sessions = "0.15.0"
